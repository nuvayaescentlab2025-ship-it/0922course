<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一個網頁</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8f7f3;
      color: #333;
    }

    main {
      text-align: center;
      padding: 32px;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: #596b58;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>你好，歡迎來到我的網頁</h1>
    <p>這是一個最簡單的 HTML 單頁範例。</p>
    <a href="mailto:hello@example.com">聯絡我</a>
  </main>
</body>
</html>
